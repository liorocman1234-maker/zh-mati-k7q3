<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מתי נוח לכולם? · זוהר</title>
<meta name="theme-color" content="#1F3A2E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== tokens ===== */
:root{
  --bg:#EDF0EA;        /* ירוק מרווה חיוור, כמו נייר יומן */
  --card:#FFFFFF;
  --ink:#1D2822;       /* ירוק-שחור */
  --ink2:#5E6B63;
  --line:#D5DCD4;
  --yes:#2F6B4F;       /* ירוק בקבוק: מתאים */
  --yesbg:#DCEBDF;
  --maybe:#C98A16;     /* זעפרן: אם אין ברירה */
  --maybebg:#F7E7C2;
  --no:#9AA39C;
  --nobg:#ECEEEB;
  --ring:#D2553A;      /* העיגול של "זה המועד" */
  --head:#1F3A2E;
  --r:18px;
  --display:"Secular One","Rubik",system-ui,sans-serif;
  --body:"Rubik",system-ui,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px;border-radius:8px}
.wrap{max-width:680px;margin:0 auto;padding:0 16px 120px}
header.top{background:var(--head);color:#fff;padding:18px 16px 22px}
header.top .in{max-width:680px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-size:26px;line-height:1.1;text-decoration:none;color:#fff}
.brand small{display:block;font-family:var(--body);font-size:14px;opacity:.75;font-weight:400}
.mode{font-size:13px;background:rgba(255,255,255,.12);padding:4px 10px;border-radius:99px;white-space:nowrap}
h1{font-family:var(--display);font-weight:400;font-size:34px;line-height:1.15;margin:28px 0 6px}
h2{font-family:var(--display);font-weight:400;font-size:24px;margin:28px 0 10px}
.muted{color:var(--ink2)}
.card{background:var(--card);border-radius:var(--r);padding:18px;margin:12px 0;box-shadow:0 1px 0 var(--line)}
label.f{display:block;font-weight:500;margin:14px 0 6px}
input[type=text],input[type=time],input[type=date],textarea,select{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff}
textarea{min-height:70px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px 20px;font-weight:600;background:var(--head);color:#fff;text-decoration:none;min-height:52px}
.btn.wide{width:100%}
.btn.soft{background:#fff;color:var(--head);border:1.5px solid var(--line)}
.btn.wa{background:#1F8F55}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 auto}
.sticky{position:fixed;bottom:0;left:0;right:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.sticky .in{max-width:680px;margin:0 auto}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);text-align:center;background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:15px;z-index:9;opacity:0;transition:opacity .25s}
.toast.on{opacity:1}

/* ===== calendar picker ===== */
.cal{user-select:none}
.cal .mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal .mh b{font-family:var(--display);font-weight:400;font-size:20px}
.cal .mh button{background:none;border:0;font-size:22px;padding:6px 12px}
.cal .g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dn{font-size:13px;color:var(--ink2);padding:4px 0}
.cal .d{aspect-ratio:1;border:0;border-radius:12px;background:transparent;font-size:16px}
.cal .d.past{color:#B9C0BA;pointer-events:none}
.cal .d.sel{background:var(--head);color:#fff;font-weight:600}
.cal .d.today{box-shadow:inset 0 0 0 1.5px var(--ink2)}

.dayrow{border-top:1px solid var(--line);padding:14px 0}
.dayrow:first-child{border-top:0}
.dayrow .dh{display:flex;justify-content:space-between;align-items:center;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font-size:15px}
.chip.on{background:var(--yesbg);border-color:var(--yes);color:var(--yes);font-weight:600}
.chip.add{border-style:dashed}
.x{background:none;border:0;color:var(--ink2);font-size:14px;text-decoration:underline}

/* ===== the signature: date tickets ===== */
.ticket{position:relative;display:grid;grid-template-columns:78px 1fr;gap:0;background:var(--card);border-radius:var(--r);margin:12px 0;overflow:visible;box-shadow:0 1px 0 var(--line)}
.ticket .stub{position:relative;border-left:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 4px;text-align:center}
.ticket .num{font-family:var(--display);font-size:40px;line-height:1}
.ticket .mon{font-size:13px;color:var(--ink2)}
.ticket .body{padding:12px 14px}
.ticket .when{font-weight:600}
.ticket .tally{font-size:14px;color:var(--ink2);margin-top:2px}
.ticket .who{font-size:13px;color:var(--ink2);margin-top:4px}
.ticket .who b{color:var(--yes);font-weight:500}
.ticket .who i{color:var(--maybe);font-style:normal}
.ticket svg.circle{position:absolute;inset:-10px -8px;width:calc(100% + 16px);height:calc(100% + 20px);pointer-events:none;overflow:visible}
.ticket svg.circle path{fill:none;stroke:var(--ring);stroke-width:3;stroke-linecap:round;stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1.1s cubic-bezier(.2,.8,.2,1) .2s forwards}
.ticket.best .stub .num{color:var(--ring)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:#FBE3DC;color:var(--ring);margin-inline-start:6px;vertical-align:2px}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.ticket svg.circle path{animation:none;stroke-dashoffset:0}}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.seg.two{grid-template-columns:repeat(2,1fr)}
.seg button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px 4px;font-size:15px;min-height:44px}
.seg button[aria-pressed=true].y{background:var(--yes);border-color:var(--yes);color:#fff}
.seg button[aria-pressed=true].m{background:var(--maybe);border-color:var(--maybe);color:#fff}
.seg button[aria-pressed=true].n{background:var(--no);border-color:var(--no);color:#fff}

/* final banner */
.final{background:var(--head);color:#fff;border-radius:var(--r);padding:20px;margin:18px 0}
.final .k{font-size:14px;opacity:.8}
.final .v{font-family:var(--display);font-size:28px;line-height:1.2;margin:4px 0 14px}
.final .btn{background:#fff;color:var(--head)}

/* table of everyone */
.tblw{overflow-x:auto;background:#fff;border-radius:var(--r);margin:12px 0}
table.all{border-collapse:collapse;font-size:14px;min-width:100%}
table.all th,table.all td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
table.all th:first-child,table.all td:first-child{text-align:start;position:sticky;right:0;background:#fff;font-weight:600}
.dot{display:inline-block;width:22px;height:22px;border-radius:7px;line-height:22px;font-size:13px;color:#fff}
.dot.y{background:var(--yes)}.dot.m{background:var(--maybe)}.dot.n{background:var(--nobg);color:var(--no)}

.polls a{display:block;text-decoration:none;color:inherit}
.polls .card{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{font-size:13px;padding:3px 10px;border-radius:99px;background:var(--yesbg);color:var(--yes);white-space:nowrap}
.pill.open{background:var(--maybebg);color:#8A5B00}
.share{display:flex;gap:8px;align-items:center;background:var(--bg);border-radius:12px;padding:8px 10px;margin-top:10px}
.share code{flex:1;font-size:13px;direction:ltr;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hint{font-size:14px;color:var(--ink2);margin-top:6px}
.empty{text-align:center;padding:36px 12px}
.empty .big{font-family:var(--display);font-size:56px;color:var(--ring);line-height:1}
</style>
</head>
<body>
<header class="top"><div class="in">
  <a class="brand" href="#/">מתי נוח לכולם?<small>מערכת התיאום של זוהר</small></a>
  <span class="mode" id="mode"></span>
</div></header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============ הגדרות: כאן מחברים את הענן (Supabase) ============
   משאירים ריק = מצב הדגמה, נשמר רק בדפדפן הזה. */
const CONFIG = {
  supabaseUrl: "https://uwyotmisduntlhshynwa.supabase.co",
  supabaseKey: "sb_publishable_pDzxIaDra-ujfE3xfW2fuA_hGW2q8lU"
};
const TZ = "Asia/Jerusalem";

/* ============ storage ============ */
const uid = (n=10)=>{const a="abcdefghijkmnpqrstuvwxyz23456789";let s="";const r=crypto.getRandomValues(new Uint8Array(n));for(const x of r)s+=a[x%a.length];return s};
const LS = {
  get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const cloud = !!(CONFIG.supabaseUrl && CONFIG.supabaseKey);

const Local = {
  async createPoll(p,key){const db=LS.get("dz_db",{polls:{},votes:{}});db.polls[p.id]={...p,final:null};db.keys=db.keys||{};db.keys[p.id]=key;LS.set("dz_db",db)},
  async getPoll(id){const db=LS.get("dz_db",{polls:{},votes:{}});return db.polls[id]||null},
  async listVotes(id){const db=LS.get("dz_db",{polls:{},votes:{}});return Object.values(db.votes).filter(v=>v.poll_id===id).sort((a,b)=>a.created_at<b.created_at?-1:1)},
  async addVote(pollId,name,answers,comment,key){const db=LS.get("dz_db",{polls:{},votes:{}});const id=uid(12);db.votes[id]={id,poll_id:pollId,name,answers,comment,created_at:new Date().toISOString(),_k:key};LS.set("dz_db",db);return id},
  async updateVote(id,key,name,answers,comment){const db=LS.get("dz_db",{polls:{},votes:{}});const v=db.votes[id];if(!v||v._k!==key)throw new Error("no");Object.assign(v,{name,answers,comment});LS.set("dz_db",db)},
  async setFinal(pollId,key,final){const db=LS.get("dz_db",{polls:{},votes:{}});if(db.keys?.[pollId]!==key)throw new Error("no");db.polls[pollId].final=final;LS.set("dz_db",db)}
};
const Cloud = {
  h(){return {"apikey":CONFIG.supabaseKey,"Content-Type":"application/json"}},
  async rpc(fn,body){const r=await fetch(`${CONFIG.supabaseUrl}/rest/v1/rpc/${fn}`,{method:"POST",headers:this.h(),body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());const t=await r.text();return t?JSON.parse(t):null},
  async get(path){const r=await fetch(`${CONFIG.supabaseUrl}/rest/v1/${path}`,{headers:this.h()});if(!r.ok)throw new Error(await r.text());return r.json()},
  async createPoll(p,key){await this.rpc("dz_create_poll",{p_id:p.id,p_data:p,p_key:key})},
  async getPoll(id){const r=await this.get(`dz_polls?id=eq.${encodeURIComponent(id)}&select=id,data,final`);if(!r.length)return null;return {...r[0].data,id:r[0].id,final:r[0].final}},
  async listVotes(id){return this.get(`dz_votes?poll_id=eq.${encodeURIComponent(id)}&select=id,poll_id,name,answers,comment,created_at&order=created_at`)},
  async addVote(pollId,name,answers,comment,key){return this.rpc("dz_add_vote",{p_poll:pollId,p_name:name,p_answers:answers,p_comment:comment,p_key:key})},
  async updateVote(id,key,name,answers,comment){await this.rpc("dz_update_vote",{p_id:id,p_key:key,p_name:name,p_answers:answers,p_comment:comment})},
  async setFinal(pollId,key,final){await this.rpc("dz_set_final",{p_poll:pollId,p_key:key,p_final:final})}
};
const DB = cloud?Cloud:Local;

/* ============ helpers ============ */
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const WD=["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
const MON=["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
const pd=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const dayLabel=s=>{const d=pd(s);return (d.getDay()===6?"שבת":"יום "+WD[d.getDay()])+`, ${d.getDate()}.${d.getMonth()+1}`};
const optLabel=o=>dayLabel(o.date)+(o.time?` · ${o.time}`:" · כל היום");
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove("on"),2200)}
const baseUrl=()=>location.href.split("#")[0];
const pollUrl=id=>`${baseUrl()}#/p/${id}`;
const myPolls=()=>LS.get("dz_mine",[]);
const myVotes=()=>LS.get("dz_myvotes",{});
async function copy(t){try{await navigator.clipboard.writeText(t);toast("הקישור הועתק")}catch(e){prompt("להעתיק את הקישור:",t)}}
const waLink=t=>`https://wa.me/?text=${encodeURIComponent(t)}`;

function score(votes,o){let y=0,m=0;for(const v of votes){const a=v.answers?.[o.id];if(a==="y")y++;else if(a==="m")m++}return {y,m,s:y+m*0.5}}

/* calendar export */
function addMin(date,time,min){const [h,mm]=time.split(":").map(Number);const d=pd(date);d.setHours(h,mm+min,0,0);return d}
const stamp=d=>`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}T${String(d.getHours()).padStart(2,"0")}${String(d.getMinutes()).padStart(2,"0")}00`;
function gcal(p,o){
  let dates;
  if(o.time){const s=addMin(o.date,o.time,0),e=addMin(o.date,o.time,p.duration||60);dates=`${stamp(s)}/${stamp(e)}`}
  else{const s=pd(o.date),e=pd(o.date);e.setDate(e.getDate()+1);dates=`${iso(s).replace(/-/g,"")}/${iso(e).replace(/-/g,"")}`}
  const q=new URLSearchParams({action:"TEMPLATE",text:p.title,dates,ctz:TZ,details:p.note||"",location:p.place||""});
  return "https://calendar.google.com/calendar/render?"+q.toString();
}
function ics(p,o){
  const e=s=>String(s||"").replace(/[\\,;]/g,m=>"\\"+m).replace(/\n/g,"\\n");
  let dt;
  if(o.time){dt=`DTSTART;TZID=${TZ}:${stamp(addMin(o.date,o.time,0))}\r\nDTEND;TZID=${TZ}:${stamp(addMin(o.date,o.time,p.duration||60))}`}
  else{const n=pd(o.date);n.setDate(n.getDate()+1);dt=`DTSTART;VALUE=DATE:${o.date.replace(/-/g,"")}\r\nDTEND;VALUE=DATE:${iso(n).replace(/-/g,"")}`}
  const body=`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//zohar//poll//HE\r\nBEGIN:VEVENT\r\nUID:${p.id}-${o.id}@zohar\r\nDTSTAMP:${stamp(new Date())}\r\n${dt}\r\nSUMMARY:${e(p.title)}\r\nLOCATION:${e(p.place)}\r\nDESCRIPTION:${e(p.note)}\r\nEND:VEVENT\r\nEND:VCALENDAR\r\n`;
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([body],{type:"text/calendar"}));a.download=`${p.title}.ics`;a.click();
}

/* ============ router ============ */
let timer=null;
async function route(){
  clearInterval(timer);
  const h=location.hash.replace(/^#/,"")||"/";
  const app=$("#app");
  let m;
  if(h==="/"||h==="")return home(app);
  if(h==="/new")return create(app);
  if((m=h.match(/^\/p\/([a-z0-9]+)(?:\/admin\/([a-z0-9]+))?/)))return pollPage(app,m[1],m[2]);
  location.hash="#/";
}
window.addEventListener("hashchange",()=>{route();scrollTo(0,0)});

/* ============ home ============ */
function home(app){
  const mine=myPolls();
  app.innerHTML=`
    <h1>הסקרים שלי</h1>
    <p class="muted">מציעים כמה מועדים, שולחים קישור בוואטסאפ, וכל אחד מסמן מה מתאים לו. בלי הרשמה ובלי אפליקציה.</p>
    <a class="btn wide" href="#/new" style="margin:10px 0 6px">+ סקר חדש</a>
    <div class="polls">${mine.length?mine.map(p=>`
      <a href="#/p/${p.id}/admin/${p.key}"><div class="card">
        <div><b>${esc(p.title)}</b><div class="hint">${p.count} מועדים · נוצר ${esc(p.created)}</div></div>
        <span class="pill open">פתוח</span>
      </div></a>`).join(""):`
      <div class="empty"><div class="big">?</div><p class="muted">עוד אין סקרים. מתחילים מ"סקר חדש".</p></div>`}
    </div>`;
  // refresh status pills
  mine.forEach(async (p,i)=>{try{const pl=await DB.getPoll(p.id);if(pl?.final){const el=app.querySelectorAll(".polls .pill")[i];if(el){el.textContent="נקבע";el.className="pill"}}}catch(e){}});
}

/* ============ create ============ */
function create(app){
  const st={title:"",place:"",note:"",duration:60,allowMaybe:true,days:{},month:new Date()};
  st.month=new Date(st.month.getFullYear(),st.month.getMonth(),1);
  const PRESETS=["09:00","12:00","17:00","19:00","20:30"];

  app.innerHTML=`
    <h1>סקר חדש</h1>
    <div class="card">
      <label class="f" for="t">על מה נפגשים?</label>
      <input id="t" type="text" maxlength="80" placeholder="למשל: ארוחת שישי משפחתית">
      <label class="f" for="pl">איפה <span class="muted">(לא חובה)</span></label>
      <input id="pl" type="text" maxlength="120" placeholder="כתובת, או קישור לזום">
      <label class="f" for="nt">כמה מילים למוזמנים <span class="muted">(לא חובה)</span></label>
      <textarea id="nt" maxlength="400" placeholder="מה מביאים, למי זה מתאים..."></textarea>
      <div class="row">
        <div><label class="f" for="du">כמה זמן</label>
          <select id="du"><option value="30">חצי שעה</option><option value="60" selected>שעה</option><option value="90">שעה וחצי</option><option value="120">שעתיים</option><option value="180">שלוש שעות</option></select></div>
        <div><label class="f" for="mb">תשובות אפשריות</label>
          <select id="mb"><option value="1" selected>מתאים / אם אין ברירה / לא</option><option value="0">מתאים / לא</option></select></div>
      </div>
    </div>
    <h2>1. בוחרים ימים</h2>
    <div class="card cal" id="cal"></div>
    <h2>2. בוחרים שעות לכל יום</h2>
    <div class="card" id="days"></div>
    <div class="sticky"><div class="in"><button class="btn wide" id="go" disabled>יוצרים את הסקר</button></div></div>`;

  const sync=()=>{
    st.title=$("#t").value.trim();st.place=$("#pl").value.trim();st.note=$("#nt").value.trim();
    st.duration=+$("#du").value;st.allowMaybe=$("#mb").value==="1";
    const n=Object.values(st.days).reduce((a,d)=>a+(d.allday?1:d.times.length),0);
    $("#go").disabled=!(st.title&&n);
    $("#go").textContent=n?`יוצרים את הסקר · ${n} מועדים`:"יוצרים את הסקר";
  };
  ["#t","#pl","#nt","#du","#mb"].forEach(s=>$(s).addEventListener("input",sync));

  function drawCal(){
    const m=st.month,y=m.getFullYear(),mo=m.getMonth();
    const first=new Date(y,mo,1).getDay(),len=new Date(y,mo+1,0).getDate();
    const today=iso(new Date());
    let cells="";for(let i=0;i<first;i++)cells+="<span></span>";
    for(let d=1;d<=len;d++){const s=iso(new Date(y,mo,d));cells+=`<button class="d${s<today?" past":""}${st.days[s]?" sel":""}${s===today?" today":""}" data-d="${s}" aria-pressed="${!!st.days[s]}" aria-label="${dayLabel(s)}">${d}</button>`}
    $("#cal").innerHTML=`<div class="mh"><button id="nx" aria-label="חודש הבא">‹</button><b>${MON[mo]} ${y}</b><button id="pv" aria-label="חודש קודם">›</button></div>
      <div class="g">${["א","ב","ג","ד","ה","ו","ש"].map(x=>`<span class="dn">${x}</span>`).join("")}${cells}</div>`;
    $("#pv").onclick=()=>{st.month=new Date(y,mo-1,1);drawCal()};
    $("#nx").onclick=()=>{st.month=new Date(y,mo+1,1);drawCal()};
    $("#cal").querySelectorAll(".d").forEach(b=>b.onclick=()=>{const s=b.dataset.d;if(st.days[s])delete st.days[s];else st.days[s]={times:["19:00"],allday:false};drawCal();drawDays()});
  }
  function drawDays(){
    const keys=Object.keys(st.days).sort();
    if(!keys.length){$("#days").innerHTML=`<p class="muted" style="margin:0">מסמנים ימים בלוח למעלה, והם יופיעו כאן.</p>`;sync();return}
    $("#days").innerHTML=keys.map(k=>{const d=st.days[k];const all=[...new Set([...PRESETS,...d.times])].sort();return `
      <div class="dayrow" data-k="${k}">
        <div class="dh"><span>${dayLabel(k)}</span><button class="x" data-rm>להסיר</button></div>
        <div class="chips">
          <button class="chip${d.allday?" on":""}" data-all aria-pressed="${d.allday}">כל היום</button>
          ${d.allday?"":all.map(t=>`<button class="chip${d.times.includes(t)?" on":""}" data-t="${t}" aria-pressed="${d.times.includes(t)}">${t}</button>`).join("")}
          ${d.allday?"":`<label class="chip add">שעה אחרת <input type="time" data-new style="border:0;padding:0;width:auto;background:none"></label>`}
        </div>
      </div>`}).join("")+(keys.length>1?`<button class="btn soft wide" id="copyt" style="margin-top:8px">להעתיק את השעות של היום הראשון לכל הימים</button>`:"");
    $("#days").querySelectorAll(".dayrow").forEach(r=>{
      const d=st.days[r.dataset.k];
      r.querySelector("[data-rm]").onclick=()=>{delete st.days[r.dataset.k];drawCal();drawDays()};
      r.querySelector("[data-all]").onclick=()=>{d.allday=!d.allday;drawDays()};
      r.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{const t=b.dataset.t;d.times=d.times.includes(t)?d.times.filter(x=>x!==t):[...d.times,t];drawDays()});
      const nw=r.querySelector("[data-new]");if(nw)nw.onchange=()=>{if(nw.value&&!d.times.includes(nw.value)){d.times.push(nw.value);drawDays()}};
    });
    const cp=$("#copyt");if(cp)cp.onclick=()=>{const f=st.days[keys[0]];keys.forEach(k=>st.days[k]={times:[...f.times],allday:f.allday});drawDays();toast("השעות הועתקו לכל הימים")};
    sync();
  }
  drawCal();drawDays();

  $("#go").onclick=async()=>{
    sync();
    const options=[];Object.keys(st.days).sort().forEach(k=>{const d=st.days[k];if(d.allday)options.push({id:uid(6),date:k,time:null});else [...d.times].sort().forEach(t=>options.push({id:uid(6),date:k,time:t}))});
    const p={id:uid(10),title:st.title,place:st.place,note:st.note,duration:st.duration,allowMaybe:st.allowMaybe,options,created_at:new Date().toISOString()};
    const key=uid(16);
    $("#go").disabled=true;$("#go").textContent="שומרים...";
    try{
      await DB.createPoll(p,key);
      const mine=myPolls();mine.unshift({id:p.id,key,title:p.title,count:options.length,created:new Date().toLocaleDateString("he-IL")});LS.set("dz_mine",mine);
      location.hash=`#/p/${p.id}/admin/${key}`;
    }catch(e){toast("השמירה לא הצליחה. בודקים חיבור לאינטרנט ומנסים שוב");$("#go").disabled=false;sync()}
  };
}

/* ============ poll page (vote + results + admin) ============ */
async function pollPage(app,id,adminKey){
  app.innerHTML=`<p class="muted" style="margin-top:30px">טוען...</p>`;
  let p,votes;
  try{p=await DB.getPoll(id);votes=await DB.listVotes(id)}catch(e){app.innerHTML=`<div class="empty"><p>אין חיבור לשרת. בודקים אינטרנט ומרעננים את הדף.</p></div>`;return}
  if(!p){app.innerHTML=`<div class="empty"><div class="big">?</div><p>הסקר הזה לא נמצא. כדאי לבקש מהשולח קישור חדש.</p><a class="btn" href="#/">לדף הבית</a></div>`;return}
  const isAdmin=!!adminKey;
  const mv=myVotes()[id];             // {id,key}
  let mine=mv?votes.find(v=>v.id===mv.id):null;
  let draft={name:mine?.name||LS.get("dz_name",""),answers:{...(mine?.answers||{})},comment:mine?.comment||""};
  let editing=!mine&&!isAdmin;

  function render(){
    const scored=p.options.map(o=>({o,...score(votes,o)}));
    const top=Math.max(0,...scored.map(x=>x.s));
    const finalOpt=p.final?p.options.find(o=>o.id===p.final):null;
    const link=pollUrl(id);
    const invite=`היי, מנסים למצוא מועד ל"${p.title}".\nמסמנים כאן מה מתאים לכם, לוקח חצי דקה:\n${link}`;

    app.innerHTML=`
      <h1>${esc(p.title)}</h1>
      ${p.place?`<p class="muted" style="margin:0">📍 ${esc(p.place)}</p>`:""}
      ${p.note?`<p style="margin:6px 0 0">${esc(p.note)}</p>`:""}

      ${finalOpt?`<div class="final"><div class="k">המועד נקבע</div><div class="v">${optLabel(finalOpt)}</div>
        <div class="row"><a class="btn" href="${gcal(p,finalOpt)}" target="_blank" rel="noopener">להוסיף ליומן גוגל</a><button class="btn" id="ics">לאייפון / אאוטלוק</button></div>
        ${isAdmin?`<a class="btn wa wide" style="margin-top:10px;background:#1F8F55;color:#fff" target="_blank" rel="noopener" href="${waLink(`נקבע! "${p.title}"\n${optLabel(finalOpt)}${p.place?`\n📍 ${p.place}`:""}\nלהוספה ליומן: ${link}`)}">לבשר לכולם בוואטסאפ</a>`:""}</div>`:""}

      ${isAdmin?`<div class="card">
        <b>הקישור למוזמנים</b>
        <div class="share"><code>${esc(link)}</code><button class="btn soft" id="cp" style="min-height:40px;padding:8px 12px">להעתיק</button></div>
        <a class="btn wa wide" style="margin-top:10px" href="${waLink(invite)}" target="_blank" rel="noopener">לשלוח בוואטסאפ</a>
        <p class="hint">את הדף הזה, עם כפתורי "לקבוע", רואה רק מי שיש לו את קישור הניהול. הוא שמור ב"הסקרים שלי" בטלפון הזה.</p>
      </div>`:""}

      <h2>${editing?"מה מתאים לך?":(isAdmin?(votes.length===1?"תשובה אחת עד עכשיו":`${votes.length} תשובות עד עכשיו`):"התשובות עד עכשיו")}</h2>
      ${editing?`<div class="card"><label class="f" for="nm" style="margin-top:0">השם שלך</label><input id="nm" type="text" maxlength="40" value="${esc(draft.name)}" placeholder="איך יכירו אותך ברשימה"></div>`:""}

      <div id="opts">${scored.map(({o,y,m})=>{
        const best=!editing&&votes.length&&top>0&&score(votes,o).s===top&&!p.final;
        const isFinal=p.final===o.id;
        const d=pd(o.date);
        const yes=votes.filter(v=>v.answers?.[o.id]==="y").map(v=>esc(v.name));
        const may=votes.filter(v=>v.answers?.[o.id]==="m").map(v=>esc(v.name));
        const a=draft.answers[o.id];
        return `<div class="ticket${best||isFinal?" best":""}" data-o="${o.id}">
          ${best||isFinal?`<svg class="circle" viewBox="0 0 400 120" preserveAspectRatio="none" aria-hidden="true"><path d="M30 18 C 140 -4, 300 2, 384 22 C 404 46, 398 96, 360 108 C 250 124, 90 120, 22 104 C -2 88, 2 30, 44 14"/></svg>`:""}
          <div class="stub"><div class="num">${d.getDate()}</div><div class="mon">${MON[d.getMonth()]}</div></div>
          <div class="body">
            <div class="when">${d.getDay()===6?"שבת":"יום "+WD[d.getDay()]} · ${o.time||"כל היום"}${isFinal?`<span class="tag">נקבע</span>`:best?`<span class="tag">הכי מתאים</span>`:""}</div>
            <div class="tally">${y} מתאים${p.allowMaybe?` · ${m} אם אין ברירה`:""}</div>
            ${!editing&&(yes.length||may.length)?`<div class="who">${yes.map(n=>`<b>${n}</b>`).join(", ")}${may.length?(yes.length?" · ":"")+may.map(n=>`<i>${n}</i>`).join(", "):""}</div>`:""}
            ${editing?`<div class="seg${p.allowMaybe?"":" two"}">
              <button class="y" data-a="y" aria-pressed="${a==="y"}">מתאים</button>
              ${p.allowMaybe?`<button class="m" data-a="m" aria-pressed="${a==="m"}">אם אין ברירה</button>`:""}
              <button class="n" data-a="n" aria-pressed="${a==="n"}">לא</button></div>`:""}
            ${isAdmin&&!editing?`<button class="btn soft" data-final style="margin-top:10px;min-height:40px;padding:8px 14px">${isFinal?"לבטל את הקביעה":"לקבוע את המועד הזה"}</button>`:""}
          </div></div>`}).join("")}</div>

      ${editing?`<div class="card"><label class="f" for="cm" style="margin-top:0">הערה <span class="muted">(לא חובה)</span></label><input id="cm" type="text" maxlength="140" value="${esc(draft.comment)}" placeholder="למשל: אגיע קצת באיחור"></div>`:""}

      ${!editing&&votes.length?`<h2>כל התשובות</h2><div class="tblw"><table class="all"><thead><tr><th>שם</th>${p.options.map(o=>{const d=pd(o.date);return `<th>${d.getDate()}.${d.getMonth()+1}<br><span class="muted">${o.time||"כל היום"}</span></th>`}).join("")}</tr></thead>
        <tbody>${votes.map(v=>`<tr><td>${esc(v.name)}${v.comment?`<div class="hint" style="font-weight:400;white-space:normal;min-width:110px;max-width:180px">${esc(v.comment)}</div>`:""}</td>${p.options.map(o=>{const a=v.answers?.[o.id]||"n";return `<td><span class="dot ${a}" aria-label="${{y:"מתאים",m:"אם אין ברירה",n:"לא"}[a]}">${{y:"✓",m:"~",n:"✕"}[a]}</span></td>`}).join("")}</tr>`).join("")}</tbody></table></div>`:""}
      ${!editing&&!votes.length?`<div class="empty"><p class="muted">עוד אף אחד לא ענה. שולחים את הקישור, והתשובות יופיעו כאן לבד.</p></div>`:""}

      <div class="sticky"><div class="in">${editing
        ?`<button class="btn wide" id="send">${mine?"לשמור את השינויים":"לשלוח את התשובה"}</button>`
        :(!isAdmin?`<button class="btn soft wide" id="edit">${mine?"לשנות את התשובה שלי":"להוסיף תשובה"}</button>`:`<button class="btn soft wide" id="edit">לענות גם בעצמי</button>`)}</div></div>`;

    // wire
    const cp=$("#cp");if(cp)cp.onclick=()=>copy(link);
    const ic=$("#ics");if(ic)ic.onclick=()=>ics(p,finalOpt);
    const ed=$("#edit");if(ed)ed.onclick=()=>{editing=true;render();scrollTo(0,0)};
    app.querySelectorAll(".ticket").forEach(t=>{
      t.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{draft.answers[t.dataset.o]=b.dataset.a;t.querySelectorAll("[data-a]").forEach(x=>x.setAttribute("aria-pressed",x===b))});
      const f=t.querySelector("[data-final]");
      if(f)f.onclick=async()=>{const val=p.final===t.dataset.o?null:t.dataset.o;try{await DB.setFinal(id,adminKey,val);p.final=val;render();scrollTo(0,0);if(val)toast("נקבע. אפשר לשלוח לכולם")}catch(e){toast("קישור הניהול לא תקין")}};
    });
    const nm=$("#nm");if(nm)nm.oninput=()=>draft.name=nm.value;
    const cm=$("#cm");if(cm)cm.oninput=()=>draft.comment=cm.value;
    const sd=$("#send");if(sd)sd.onclick=async()=>{
      const name=draft.name.trim();
      if(!name){toast("רק השם חסר");$("#nm").focus();return}
      const missing=p.options.filter(o=>!draft.answers[o.id]);
      missing.forEach(o=>draft.answers[o.id]="n");
      sd.disabled=true;sd.textContent="שולחים...";
      try{
        LS.set("dz_name",name);
        const cur=myVotes()[id];
        if(mine&&cur){await DB.updateVote(mine.id,cur.key,name,draft.answers,draft.comment.trim())}
        else{const key=uid(16);const vid=await DB.addVote(id,name,draft.answers,draft.comment.trim(),key);const all=myVotes();all[id]={id:vid,key};LS.set("dz_myvotes",all)}
        votes=await DB.listVotes(id);const nv=myVotes()[id];mine=votes.find(v=>v.id===nv.id);
        editing=false;render();scrollTo(0,0);toast("התשובה נשמרה. תודה!");
      }catch(e){sd.disabled=false;sd.textContent="לנסות שוב";toast("השליחה לא הצליחה. בודקים אינטרנט ומנסים שוב")}
    };
  }
  render();
  // live refresh while looking at results
  timer=setInterval(async()=>{if(editing||document.hidden)return;try{const nv=await DB.listVotes(id);const np=await DB.getPoll(id);if(nv.length!==votes.length||np.final!==p.final||JSON.stringify(nv)!==JSON.stringify(votes)){votes=nv;p=np;render()}}catch(e){}},12000);
}

$("#mode").textContent=cloud?"מחובר לענן":"מצב הדגמה";
route();
</script>
</body>
